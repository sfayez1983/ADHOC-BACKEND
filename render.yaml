# Render Blueprint: Render reads this file when you create the service from the repo.
# Every "sync: false" variable is asked for in the Render dashboard (values are NOT stored here).
services:
  - type: web
    name: adhoc-backend
    runtime: node
    plan: starter            # free spins down when idle: ArcGIS webhooks can time out
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    # Keeps Drive upload progress, outlet folder names and webhook logs between deploys/restarts,
    # so an interrupted upload continues where it stopped. (A disk needs a paid plan.)
    disk:
      name: adhoc-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NGROK_ENABLED   # Render already gives a public https URL
        value: "false"
      - key: DATA_DIR
        value: /var/data
      - key: GOOGLE_DRIVE_AUTO_RESUME   # continue unfinished Drive uploads after a restart
        value: "true"
      - key: EXCEL_REPORTS_SHARE_BY_LINK   # Excel reports in Drive open with the link
        value: "true"
      - key: WEEKLY_CHECK_ENABLED
        value: "true"
      - key: WEEKLY_CHECK_LAYER
        value: october
      - key: CALC_SYNC_ENABLED   # writes to the live layer, so it stays off until you set "true"
        value: "false"
      - key: ADHOC_REPORT_TO   # weekly report recipients, comma separated
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "465"
      - key: GORILLA_OCTOBER_SERVER
        sync: false
      - key: GORILLA_OCTOBER_SERVICE_TOKEN
        sync: false
      - key: DB_URL
        sync: false
      - key: saltOrRounds
        sync: false
      - key: ADHOC_EMAIL
        sync: false
      - key: ADHOCK_PASSWORD
        sync: false
      - key: ARCGIS_WEBHOOK_KEY
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: FIELD_CHECK_FEATURE_SERVER
        sync: false
      - key: FIELD_CHECK_SERVICE_TOKEN
        sync: false
      - key: FLOUR_SERVICE_FEATURE_SERVER
        sync: false
      - key: FLOUR_SERVICE_TOKEN
        sync: false
      - key: KSA_SERVICE_FEATURE_SERVER
        sync: false
      - key: KSA_SERVICE_TOKEN
        sync: false
      - key: GORILLA_SERVICE_FEATURE_SERVER
        sync: false
      - key: GORILLA_SERVICE_TOKEN
        sync: false
      - key: GORILLA_July_SERVER
        sync: false
      - key: GORILLA_AUGUST_SERVER
        sync: false
      - key: GORILLA_July_August_SERVICE_TOKEN
        sync: false
      - key: REDBULL_SERVICE_TOKEN
        sync: false
      - key: REDBULL_SERVICE_FEATURE_SERVER_FEBRUARY
        sync: false
      - key: REDBULL_SERVICE_FEATURE_SERVER_MARCH
        sync: false
      - key: REDBULL_SERVICE_FEATURE_SERVER_APRIL
        sync: false
      - key: REDBULL_SERVICE_FEATURE_SERVER_MAY
        sync: false
      - key: REDBULL_SERVICE_FEATURE_SERVER_JUNE
        sync: false
      - key: REDBULL_SERVICE_FEATURE_SERVER_JULY
        sync: false
      - key: REDBULL_SERVICE_FEATURE_SERVER_AUGUST
        sync: false
      - key: REDBULL_SERVICE_FEATURE_SERVER_SEPTEMPER
